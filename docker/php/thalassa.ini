; Project PHP overrides. Loaded by every SAPI (FrankenPHP workers included)
; through PHP_INI_SCAN_DIR=/usr/local/etc/php/conf.d.
;
; PHP's stock 128M is too small for a Symfony form POST: Doctrine metadata and
; validator reflection (phpdocumentor/type-resolver) can exhaust it, and in
; FrankenPHP worker mode an OOM kills the worker mid-request, dropping the
; response the browser is waiting for.
memory_limit = 512M
