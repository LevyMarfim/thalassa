
services:
  app:
    build:
      context: .
      args:
        PHP_VERSION: ${PHP_VERSION:-8.5}
        FRANKENPHP_VERSION: ${FRANKENPHP_VERSION:-1}
    environment:
      SERVER_NAME: ${SERVER_NAME:-:80}
      APP_ENV: ${APP_ENV:-dev}
      APP_DEBUG: ${APP_DEBUG:-1}
      DATABASE_URL: postgresql://${POSTGRES_USER:-thalassa}:${POSTGRES_PASSWORD:-thalassa}@database:5432/${POSTGRES_DB:-thalassa}?serverVersion=18&charset=utf8
      MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN:-doctrine://default?auto_setup=0}
      # FrankenPHP tuning (dev overrides this block in compose.override.yaml to
      # add file watching). max_requests recycles PHP threads so worker-mode
      # memory growth stays bounded; memory_limit lives in
      # docker/php/thalassa.ini, which is baked into the image and bind-mounted
      # in dev.
      FRANKENPHP_CONFIG: |-
        max_requests 500
        worker ./public/index.php
      # Keep one booted kernel per worker thread. Cloning the kernel after
      # every request (the "1" setting) drops the container without shutting
      # it down, so each request opens a fresh PostgreSQL connection that is
      # only released once the GC breaks the container cycle. Under load that
      # lag exhausts the server's connection slots ("too many clients
      # already"). Stateful services are still reset between requests through
      # the kernel.reset tag (services_resetter), including Doctrine's
      # ManagerRegistry, which clears the EntityManager.
      FRANKENPHP_RESET_KERNEL: ${FRANKENPHP_RESET_KERNEL:-0}
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

###> doctrine/doctrine-bundle ###
  database:
    image: postgres:${POSTGRES_VERSION:-18}-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-thalassa}
      # You should definitely change the password in production
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-thalassa}
      POSTGRES_USER: ${POSTGRES_USER:-thalassa}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-thalassa}", "-U", "${POSTGRES_USER:-thalassa}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      # PG18+ manages versioned subdirectories itself: mount the parent dir
      # (see https://github.com/docker-library/postgres/pull/1259).
      - database_data:/var/lib/postgresql:rw
      # You may use a bind-mounted host directory instead, so that it is harder to accidentally remove the volume and lose all your data!
      # - ./docker/db/data:/var/lib/postgresql:rw
      # Init scripts (schema, search_path, roles) for fresh clusters.
      - ./docker/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
###< doctrine/doctrine-bundle ###

volumes:
###> doctrine/doctrine-bundle ###
  database_data:
###< doctrine/doctrine-bundle ###

  caddy_data:
  caddy_config:
