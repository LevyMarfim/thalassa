
services:
  app:
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
      - "2019:2019"
    volumes:
      - .:/app
      # Apply docker/php/thalassa.ini (memory_limit) without rebuilding the
      # image; the same file is baked in for prod.
      - ./docker/php/thalassa.ini:/usr/local/etc/php/conf.d/zz-thalassa.ini:ro
    environment:
      # Dev only: restart workers on file changes so edits apply without
      # rebuilding or restarting. Runtime files (var/) and deps (vendor/)
      # are deliberately excluded to avoid restart loops.
      FRANKENPHP_CONFIG: |-
        # Recycle threads so worker-mode memory growth stays bounded.
        max_requests 500
        worker {
            file ./public/index.php
            # 2x CPU threads is overkill for a single-user dev box, and each
            # thread holds its own memory.
            num 4
            watch ./src/**/*.php
            watch ./templates/**/*.twig
            watch ./config/**/*.yaml
            watch ./config/**/*.yml
            watch ./public/*.php
            watch ./.env
        }

###> doctrine/doctrine-bundle ###
  database:
    # Pinned so GUI tools (DBeaver) and host CLIs can use localhost:5432.
    # If another project already holds 5432, `up` fails with
    # "port is already allocated" — stop the other project first.
    ports:
      - "5432:5432"
